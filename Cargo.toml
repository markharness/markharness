[package]
name = "markharness"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/markharness/markharness"
description = "Git-native test knowledge management CLI"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.49.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
wana_kana = "5.0.0"
