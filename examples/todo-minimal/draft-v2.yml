requirement:
  id: todo-management

feature:
  id: add-todo

behavior:
  id: add-task

condition:
  id: max-length
  label: max-length
  description: Submit the todo form with a title longer than 200 characters
  steps:
    - Enter a title longer than 200 characters.
    - Click the "Add" button.

expected:
  - description: shows a length validation error
    results:
      - A length validation error is shown under the title field.
