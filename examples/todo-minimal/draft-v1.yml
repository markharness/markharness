requirement:
  id: todo-management
  label: todo-management
  axis: [workflow]

feature:
  id: add-todo
  label: add-todo
  axis: [ui, validation]

behavior:
  id: add-task
  label: add-task
  axis: [ui]
  description: User adds a new task to the list.
  steps:
    - Open the todo app.

condition:
  id: empty-title
  label: empty-title
  description: Submit the todo form with an empty title
  steps:
    - Leave the title field empty.
    - Click the "Add" button.

expected:
  - description: shows a validation error
    results:
      - A validation error is shown under the title field.
